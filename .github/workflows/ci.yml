# FloodGuard India — continuous integration.
# Backend: pytest (no network, no long simulations: every test runs on
# synthetic grids or monkeypatched solvers). Frontend: typecheck, Vitest, build.
# Rasterio / pyogrio ship manylinux wheels with GDAL inside, so no apt GDAL.
name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e backend
      - name: Engine availability (informational)
        run: python -m floodguard.cli engines
      - name: pytest
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
