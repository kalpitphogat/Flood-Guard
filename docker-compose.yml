# FloodGuard India — local stack.
#
# Docker is not required: `make setup && make demo` works natively. This file
# is for reproducible deployment. One image serves the API and the built
# dashboard on the same port (see ./Dockerfile).
#
#   GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up --build
#   -> http://localhost:8000
#
# NOTE: written against the Dockerfile in this repository, but not executed on
# the development machine (no Docker there). Treat the first `up` as a test.

services:
  floodguard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      - "8000:8000"
    volumes:
      # DEMs, runs, uploads and the job store persist on the host.
      - ./data:/app/data
    environment:
      - OPENTOPO_API_KEY=${OPENTOPO_API_KEY:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - FLOODGUARD_LOG_LEVEL=${FLOODGUARD_LOG_LEVEL:-INFO}

  # Optional: a dynamic COG tile server for very large rasters. The built-in
  # tiler in the API is enough for the demo scenarios.
  tileserver:
    image: ghcr.io/developmentseed/titiler:latest
    profiles: ["tiles"]
    ports:
      - "8001:8000"
    volumes:
      - ./data:/data:ro
    environment:
      - TITILER_API_CORS_ORIGINS=*
